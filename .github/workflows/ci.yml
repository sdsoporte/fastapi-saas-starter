name: ci

on:
  push:
    branches: [pr-*/**, feature/fastapi-saas-starter]
  pull_request:
    branches: [feature/fastapi-saas-starter]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (cov ≥ 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Ruff lint
        run: |
          . .venv/bin/activate
          ruff check app tests

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t fastapi-saas-starter:ci .
