[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-saas-starter"
version = "0.1.0"
description = "Async FastAPI multi-tenant SaaS backend starter."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sdsoporte" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "bcrypt>=4.2,<5.0",
    "redis>=5.0,<6.0",
    "slowapi>=0.1.9,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
